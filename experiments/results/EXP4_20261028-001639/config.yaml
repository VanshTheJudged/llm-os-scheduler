experiment_id: EXP4
name: Predictor quality (oracle, synthetic noise sweep, heuristic, naive baselines)
question: How does output-length prediction error affect SJF scheduling performance?
hypothesis: Mean JCT rises monotonically with synthetic noise sigma. With uninformative
  predictions (random) SJF's mean JCT matches FCFS (conservation law for size-blind
  non-preemptive policies). A predictor anti-correlated with length can be worse than
  FCFS.
