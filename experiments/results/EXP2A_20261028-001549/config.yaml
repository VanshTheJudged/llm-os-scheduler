experiment_id: EXP2A
name: FCFS vs predictive-SJF across offered load (mixed workload)
question: Does ordering by predicted output length reduce mean and tail JCT relative
  to FCFS?
hypothesis: SJF-heuristic lowers mean JCT relative to FCFS at every load, and the
  relative reduction grows with load. Throughput is unchanged because every policy
  is work-conserving.
conditions:
- label: FCFS
  policy: fcfs
- label: SJF-heuristic
  policy: sjf
  predictor:
    type: heuristic
- label: SJF-oracle
  policy: sjf
  predictor:
    type: oracle
