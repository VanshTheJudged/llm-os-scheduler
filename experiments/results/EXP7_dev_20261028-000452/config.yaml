experiment_id: EXP7
name: 'EXTENSION: predictive-SJF with linear aging'
question: Can linear aging reduce the worst-case waiting of long requests while keeping
  most of SJF's mean-JCT gain?
hypothesis: Increasing the aging rate moves results continuously from SJF (rate 0)
  toward FCFS (rate -> infinity); intermediate rates cut maximum and long-request
  P95 waiting time substantially while giving up only part of SJF's mean-JCT reduction.
